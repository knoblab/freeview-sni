[package]
name = "freeview"
version = "3.3.2"
edition = "2021"
authors = ["QuarterPi", "knoblab", "Contributors"]
description = "High-performance native Windows anti-censorship SNI desync proxy with modern PDF-DS UI"

[lib]
name = "freeview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "freeview"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.2", features = [] }
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinInet",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
netstack-smoltcp = "0.2.5"
futures = "0.3"
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
